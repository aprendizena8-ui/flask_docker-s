version: "3.9"

services:
  app_backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FLASK_ENV: development
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DOCKER_MODE: "true"
    depends_on:
      servidor_bd:
        condition: service_healthy   # espera a que MySQL esté listo
    ports:
      - "5050:5000"
    restart: always                  # reinicia si se cae
    networks:
      - red_cba

  servidor_bd:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red_cba
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx_proxy_manager:
    image: jc21/nginx-proxy-manager:latest
    restart: always
    ports:
      - "8085:80"
      - "8086:81"
      - "8443:443"
    volumes:
      - npm_data:/data
      - letsencrypt:/etc/letsencrypt
    networks:
      - red_cba

  uptime_kuma:
    image: louislam/uptime-kuma:latest
    restart: always
    ports:
      - "3005:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - red_cba

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - red_cba

  signal_cli_rest_api:
    image: bbernhard/signal-cli-rest-api:latest
    restart: always
    ports:
      - "8081:8080"
    networks:
      - red_cba

networks:
  red_cba:

volumes:
  mysql_data:
  npm_data:
  letsencrypt:
  uptime_kuma_data:
